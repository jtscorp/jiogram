plugins {
    id 'java-library'
    id 'org.springframework.boot' apply false
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    api project(':jiogram-types')
    api project(':jiogram-methods')

    api 'org.springframework:spring-webflux'
    api 'org.springframework:spring-context'
    api 'io.projectreactor:reactor-core'
    implementation 'io.projectreactor.netty:reactor-netty-http'
    implementation 'org.slf4j:slf4j-api'

    // Pinned to ${jacksonVersion} to stay on Jackson 2 even when Spring
    // Boot 4 swaps its default JSON library to Jackson 3 (tools.jackson).
    // jiogram never goes through Spring's Jackson auto-configuration —
    // WebClientTelegramSession constructs its own ObjectMapper — so we
    // are unaffected by the Spring-side switch.
    api "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation 'org.jspecify:jspecify:1.0.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
}
