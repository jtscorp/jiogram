plugins {
    id 'java-library'
    id 'org.springframework.boot' apply false
}

dependencies {
    api project(':jiogram-types')
    api project(':jiogram-methods')

    api 'org.springframework:spring-webflux'
    api 'org.springframework:spring-context'
    api 'io.projectreactor:reactor-core'
    implementation 'io.projectreactor.netty:reactor-netty-http'
    implementation 'org.slf4j:slf4j-api'

    // Jackson 2 (com.fasterxml), version from the Spring Boot BOM — not the
    // Jackson 3 (tools.jackson) that Spring Boot 4 uses by default. jiogram
    // never goes through Spring's Jackson auto-configuration —
    // WebClientTelegramSession constructs its own ObjectMapper — so we
    // are unaffected by the Spring-side switch.
    api 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.jspecify:jspecify:1.0.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
}
