name: CI (sb2.x)

on:
  push:
    branches:
      - sb2.x
  pull_request:
    branches:
      - sb2.x

jobs:
  build:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Gradle 9 needs Java 17 to run; the code is compiled for Java 11 (options.release).
        java: [17, 21]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-sb2-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-sb2-${{ runner.os }}-

      - name: Build
        run: ./gradlew clean build --no-daemon --no-parallel

      - name: Verify artifact names
        run: |
          ./gradlew publishToMavenLocal --no-daemon --no-parallel
          VERSION=$(./gradlew -q properties --property version --no-daemon | awk '/^version:/ {print $2}')
          test -n "$VERSION"
          test -f ~/.m2/repository/uz/jtscorp/jiogram/jiogram-types-sb2/$VERSION/jiogram-types-sb2-$VERSION.jar
          test -f ~/.m2/repository/uz/jtscorp/jiogram/jiogram-spring-boot-2-starter/$VERSION/jiogram-spring-boot-2-starter-$VERSION.jar

      # The examples are separate builds that consume the starter from mavenLocal (published above).
      # They are the only real users of the FSM annotation processor and catch API breakage.
      - name: Compile examples
        run: |
          for example in examples/*/; do
            echo "::group::$example"
            ./gradlew -p "$example" compileJava --no-daemon
            echo "::endgroup::"
          done
