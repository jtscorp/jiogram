name: CI (sb2.x)

on:
  push:
    branches:
      - sb2.x
  pull_request:
    branches:
      - sb2.x

jobs:
  build:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [11, 17]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-sb2-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-sb2-${{ runner.os }}-

      - name: Build
        run: ./gradlew clean build --no-daemon

      - name: Verify artifact names
        run: |
          ./gradlew publishToMavenLocal --no-daemon
          test -f ~/.m2/repository/uz/jtscorp/jiogram/jiogram-types-sb2/0.2.0-SNAPSHOT/jiogram-types-sb2-0.2.0-SNAPSHOT.jar
          test -f ~/.m2/repository/uz/jtscorp/jiogram/jiogram-spring-boot-2-starter/0.2.0-SNAPSHOT/jiogram-spring-boot-2-starter-0.2.0-SNAPSHOT.jar
