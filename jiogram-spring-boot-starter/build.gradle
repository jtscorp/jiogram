plugins {
    id 'java-library'
    id 'org.springframework.boot' apply false
}

dependencies {
    api project(':jiogram-core')
    api project(':jiogram-fsm')

    // No web server: polling bots need only the HTTP client (spring-webflux WebClient and
    // reactor-netty, both from jiogram-core). Webhook mode needs a server, which the application
    // adds itself, e.g. spring-boot-starter-webflux.
    api 'org.springframework.boot:spring-boot-starter'

    // Optional Redis support for distributed FSM storage
    compileOnly 'org.springframework.data:spring-data-redis'

    // The webhook endpoint for Spring MVC applications; WebFlux comes with jiogram-core.
    compileOnly 'org.springframework:spring-webmvc'
    compileOnly 'javax.servlet:javax.servlet-api'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    // Spring Boot 2.7's spring-boot-starter-test does not include Awaitility (3.x does); the BOM
    // manages its version.
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'org.springframework:spring-webmvc'
    testImplementation 'javax.servlet:javax.servlet-api'
}
