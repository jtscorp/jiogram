plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.18' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = findProperty('group')
    version = findProperty('version')

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
        withJavadocJar()
        withSourcesJar()
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.release = 11
    }

    tasks.withType(Test) {
        useJUnitPlatform()
    }

    tasks.withType(Javadoc) {
        def opts = options as StandardJavadocDocletOptions
        opts.addStringOption('source', '11')
        opts.addBooleanOption('Xdoclint:all,-missing', true)
        options.encoding = 'UTF-8'
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${junitVersion}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java

                // Every artifact on sb2.x carries a -sb2 suffix to avoid
                // Maven Central GAV collisions with sb3.x and main (sb4).
                artifactId = (project.name == 'jiogram-spring-boot-starter')
                    ? 'jiogram-spring-boot-2-starter'
                    : "${project.name}-sb2"

                pom {
                    name = (project.name == 'jiogram-spring-boot-starter')
                        ? 'jiogram-spring-boot-2-starter'
                        : "${project.name}-sb2"
                    description = 'Jiogram - Java Spring Framework for Telegram Bots'
                    url = 'https://github.com/jaxongir/jiogram'

                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }

                    developers {
                        developer {
                            id = 'jaxongir'
                            name = 'Jaxongir'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/jaxongir/jiogram.git'
                        developerConnection = 'scm:git:ssh://github.com/jaxongir/jiogram.git'
                        url = 'https://github.com/jaxongir/jiogram'
                    }
                }
            }
        }

        repositories {
            maven {
                name = 'staging'
                url = layout.buildDirectory.dir('staging-deploy').get().asFile.toURI()
            }
        }
    }

    signing {
        required = { !version.toString().endsWith('SNAPSHOT') }
        if (!version.toString().endsWith('SNAPSHOT')) {
            useGpgCmd()
            sign publishing.publications.mavenJava
        }
    }
}
