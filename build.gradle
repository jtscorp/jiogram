plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = findProperty('group')
    version = findProperty('version')

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        withJavadocJar()
        withSourcesJar()
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['--enable-preview'])
    }

    tasks.withType(Test) {
        useJUnitPlatform()
        jvmArgs('--enable-preview')
    }

    tasks.withType(Javadoc) {
        def opts = options as StandardJavadocDocletOptions
        opts.addBooleanOption('-enable-preview', true)
        opts.addStringOption('source', '25')
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${junitVersion}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java

                pom {
                    name = project.name
                    description = 'Jiogram - Java Spring Framework for Telegram Bots'
                    url = 'https://github.com/jaxongir/jiogram'

                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }

                    developers {
                        developer {
                            id = 'jaxongir'
                            name = 'Jaxongir'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/jaxongir/jiogram.git'
                        developerConnection = 'scm:git:ssh://github.com/jaxongir/jiogram.git'
                        url = 'https://github.com/jaxongir/jiogram'
                    }
                }
            }
        }

        repositories {
            maven {
                name = 'staging'
                url = layout.buildDirectory.dir('staging-deploy').get().asFile.toURI()
            }
        }
    }

    signing {
        required { !version.toString().endsWith('SNAPSHOT') }
        if (!version.toString().endsWith('SNAPSHOT')) {
            useGpgCmd()
            sign publishing.publications.mavenJava
        }
    }
}
