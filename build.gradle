plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.18' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = findProperty('group')
    version = findProperty('version')

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'
    apply plugin: 'io.spring.dependency-management'

    // One BOM for every module: Jackson 2, Reactor, Spring and JUnit versions all come
    // from Spring Boot, so tests run against the versions consumers get at runtime.
    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
        withJavadocJar()
        withSourcesJar()
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.release.set(11)
    }

    tasks.withType(Test) {
        useJUnitPlatform()
    }

    tasks.withType(Javadoc) {
        def opts = options as StandardJavadocDocletOptions
        opts.addStringOption('source', '11')
        opts.addBooleanOption('Xdoclint:all,-missing', true)
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java

                // BOM-managed dependencies are declared without a version; write the resolved
                // versions into the published POM and Gradle module metadata, so consumers
                // that do not import the Spring Boot BOM can still resolve them.
                versionMapping {
                    usage('java-api') {
                        fromResolutionOf('runtimeClasspath')
                    }
                    usage('java-runtime') {
                        fromResolutionResult()
                    }
                }

                // Every artifact on sb2.x (Spring Boot 2.7) carries a -sb2 suffix
                // to avoid Maven Central GAV collisions with sb3.x and main (sb4).
                // The starter is named 'jiogram-spring-boot-2-starter'.
                artifactId = (project.name == 'jiogram-spring-boot-starter')
                    ? 'jiogram-spring-boot-2-starter'
                    : "${project.name}-sb2"

                pom {
                    name = (project.name == 'jiogram-spring-boot-starter')
                        ? 'jiogram-spring-boot-2-starter'
                        : "${project.name}-sb2"
                    description = 'Jiogram - Java Spring Framework for Telegram Bots'
                    url = 'https://github.com/jtscorp/jiogram'

                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }

                    developers {
                        developer {
                            id = 'jaxongir'
                            name = 'Jaxongir'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/jtscorp/jiogram.git'
                        developerConnection = 'scm:git:ssh://github.com/jtscorp/jiogram.git'
                        url = 'https://github.com/jtscorp/jiogram'
                    }
                }
            }
        }

        repositories {
            maven {
                name = 'staging'
                url = layout.buildDirectory.dir('staging-deploy').get().asFile.toURI()
            }
        }
    }

    signing {
        required = { !version.toString().endsWith('SNAPSHOT') }
        if (!version.toString().endsWith('SNAPSHOT')) {
            useGpgCmd()
            sign publishing.publications.mavenJava
        }
    }
}
