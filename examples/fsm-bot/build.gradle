plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'uz.example'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    // When building from the Jiogram source tree, use:
    // implementation project(':jiogram-spring-boot-starter')
    implementation 'uz.jtscorp.jiogram:jiogram-spring-boot-4-starter:0.2.1-SNAPSHOT'
    annotationProcessor 'uz.jtscorp.jiogram:jiogram-fsm-processor-sb4:0.2.1-SNAPSHOT'

    // Optional: keeps FSM state in Redis (telegram.fsm.storage=redis) so it survives restarts and
    // is shared between instances. Unused while the storage is "memory".
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
}
