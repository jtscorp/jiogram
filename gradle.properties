group=uz.jtscorp.jiogram
version=0.2.0-SNAPSHOT

# Dependency versions
# Jackson 2, Reactor, Spring and JUnit versions come from this Spring Boot BOM.
springBootVersion=2.7.18

# Gradle settings
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Maven Central publishing (./gradlew publishToCentral)
# Set these in ~/.gradle/gradle.properties - never commit real values here:
# centralPortalUsername=   (Central Portal user token, name part)
# centralPortalPassword=   (Central Portal user token, password part)
# signing.gnupg.keyName=   (key id for the local gpg), or for CI:
# signingKey= / signingPassword=   (ASCII-armored private key and its passphrase)
