plugins {
    id 'java-library'
    id 'org.springframework.boot' apply false
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    api project(':jiogram-core')

    implementation 'org.jspecify:jspecify:1.0.0'
    implementation 'io.projectreactor:reactor-core'
    implementation 'org.slf4j:slf4j-api'

    // Optional Redis support for distributed state storage
    compileOnly 'org.springframework.data:spring-data-redis'
    compileOnly 'io.lettuce:lettuce-core'
    // Pinned to ${jacksonVersion} (same rationale as jiogram-core).
    compileOnly "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    // RedisStateStorageTest runs against a real Redis; skipped when Docker is unavailable.
    testImplementation 'org.springframework.data:spring-data-redis'
    testImplementation 'io.lettuce:lettuce-core'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}
